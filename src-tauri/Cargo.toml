[workspace]
members = [".", "updater"]
resolver = "2"

[package]
name = "stathive"
version = "0.0.0"
description = "StatHive — кроссплатформенный клиент выгрузки (Tauri + React)"
authors = ["StatHive"]
edition = "2021"
default-run = "stathive"

[lib]
name = "stathive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stathive"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
regex = "1"
urlencoding = "2"
url = "2"
calamine = "0.37"
rust_xlsxwriter = "0.79"
tauri-plugin-dialog = "2"
jsonwebtoken = { version = "9", features = ["pem"] }
base64 = "0.22"
aes-gcm = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
keyring = "3"
argon2 = "0.5"
password-hash = "0.5"

# thin LTO + несколько CGU: почти тот же размер/скорость, в разы быстрее full LTO
# на Windows MSVC (иначе CI 20+ мин и будет хуже по мере роста кода).
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
debug = false
# Не копить incremental в release (и так почти не даёт выигрыша при LTO).
incremental = false

# Dev: символы не в отдельный огромный PDB-поток сверх нужного для отладки MSVC.
[profile.dev]
incremental = true
