[package]
name = "stathive_updater"
version = "0.0.0"
edition = "2021"
description = "Лёгкий console updater (без Tauri / app-lib)"
publish = false

[[bin]]
name = "stathive_updater"
path = "src/main.rs"

[build-dependencies]
# Windows: иконка exe (обновление), main остаётся на Tauri icons/
winresource = "0.1"

[dependencies]
dirs = "6"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
